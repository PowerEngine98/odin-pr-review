<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odin</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-head">
      <button id="back" class="back" hidden>← Pull requests</button>
      <span id="side-title" class="side-title">Pull requests</span>
    </div>
    <iframe id="side" title="Odin pull requests and files"></iframe>
  </aside>
  <main class="main">
    <section id="status" class="status"><p>Choose a pull request to draw it.</p></section>
    <iframe id="page" title="Odin change graph" hidden></iframe>
  </main>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
