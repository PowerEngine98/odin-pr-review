<!--
  Activity bar icon: Odin, traced from the reference line art.

  The reference is 1240px square. Landmarks were read off it and mapped onto
  this 24px grid with x' = (x - 620)/46.4 + 12 and y' = (y - 95)/46.4 + 1, so
  the proportions carry across rather than being redrawn by eye: horn tips at
  the top corners, the helm across the middle third, the brow band just above
  centre, and a beard wider than the helm falling to a point near the bottom.

  What the tracing drops matters as much as what it keeps. VS Code renders
  activity bar icons as a mask, so every opaque pixel becomes one themed
  colour: shading, outlines-within-shapes and hairline detail all collapse.
  Gone are the ridges banding the horns, the beard's interior strands, the
  studs around the eyepatch, and the modelling of nose and brow. The face is an
  opening in the beard rather than a drawn feature, for the same reason — under
  a mask there is no second colour to draw skin with, so it has to be absent
  material instead. The eyepatch is a solid disc; a ring that small fills in
  and reads as a smudge.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="currentColor">
    <!-- horns: crescents sweeping from the helm's sides out to the corners -->
    <path d="M3.3 2.1c.3 2.9 2.3 5.9 5.2 7.5-1.9-3.2-3.5-6-5.2-7.5z" />
    <path d="M20.7 2.1c-.3 2.9-2.3 5.9-5.2 7.5 1.9-3.2 3.5-6 5.2-7.5z" />
    <!-- beard, with the face left open above the moustache -->
    <path d="M6.5 10.9c-1.2 2.4-1.4 5.3-.4 7.6 1.2 2.6 3.3 4 5.9 4.6 2.6-.6 4.7-2 5.9-4.6 1-2.3.8-5.2-.4-7.6-.7 2.1-1.8 3.2-5.5 3.2s-4.8-1.1-5.5-3.2z" />
    <!-- the eye he traded -->
    <circle cx="14.5" cy="11.6" r="1.35" />
    <!-- the eye he kept -->
    <circle cx="10.0" cy="11.5" r="0.7" />
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- helm -->
    <path d="M7.8 9.6a4.25 4.9 0 0 1 8.5 0" />
    <!-- brow band -->
    <path d="M7.3 9.6h9.6" />
    <!-- crest, running from above the helm down to the brow -->
    <path d="M12.1 2.9v6.7" />
  </g>
</svg>
